# Virtual Projection Viewer — build workflow
# v3 (2026-09-10)
#   - macOS: build a real .app bundle (--windowed) so the file dialog works
#   - macOS: declare NSAppleEventsUsageDescription, required for osascript-
#     backed file pickers on recent macOS
#   - macOS: sign AFTER the plist edit (editing a bundle invalidates its signature)
#   - Windows job unchanged from v2
#
# v2 (2026-09-10)
#   - bundle ndi-python (NDIlib) so releases have real NDI, not just the fallback
#   - ad-hoc codesign the macOS bundle so its internal dylibs load

name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify NDI is importable
        run: python -c "import NDIlib; print('NDIlib OK')"

      - name: Build exe
        shell: bash
        run: |
          python -m PyInstaller \
            --name "VirtualProjectionViewer" \
            --onedir \
            --noconfirm \
            --hidden-import moderngl \
            --hidden-import glm \
            --hidden-import numpy \
            --hidden-import tkinter \
            --hidden-import tkinter.filedialog \
            --hidden-import NDIlib \
            --collect-all NDIlib \
            --collect-all imgui_bundle \
            --collect-all moderngl \
            main.py

      - name: Zip artifact
        shell: bash
        run: |
          cd dist
          7z a ../VirtualProjectionViewer-Windows.zip VirtualProjectionViewer/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualProjectionViewer-Windows
          path: VirtualProjectionViewer-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify NDI is importable
        run: python -c "import NDIlib; print('NDIlib OK')"

      # --windowed produces dist/VirtualProjectionViewer.app alongside the
      # plain onedir folder. The .app is what we ship: a bare binary is not
      # permitted to send Apple events, which is what the imgui_bundle file
      # dialog uses under the hood.
      - name: Build app
        run: |
          python -m PyInstaller \
            --name "VirtualProjectionViewer" \
            --onedir \
            --windowed \
            --noconfirm \
            --osx-bundle-identifier se.velourfilm.virtualprojectionviewer \
            --hidden-import moderngl \
            --hidden-import glm \
            --hidden-import numpy \
            --hidden-import tkinter \
            --hidden-import tkinter.filedialog \
            --hidden-import NDIlib \
            --collect-all NDIlib \
            --collect-all imgui_bundle \
            --collect-all moderngl \
            main.py

      # Without this key macOS denies the Apple event outright and the
      # picker throws before it can draw anything.
      - name: Add Apple events usage description
        run: |
          PLIST=dist/VirtualProjectionViewer.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c \
            "Add :NSAppleEventsUsageDescription string 'Virtual Projection Viewer uses this to show the file picker when you load a model.'" \
            "$PLIST"
          /usr/libexec/PlistBuddy -c \
            "Add :NSHighResolutionCapable bool true" \
            "$PLIST" || true
          plutil -lint "$PLIST"

      # Must come after the plist edit — any change to bundle contents
      # invalidates an existing signature.
      - name: Ad-hoc codesign
        run: |
          codesign --force --deep --sign - dist/VirtualProjectionViewer.app
          codesign --verify --verbose dist/VirtualProjectionViewer.app

      - name: Zip artifact
        run: |
          cd dist
          zip -ry ../VirtualProjectionViewer-macOS.zip VirtualProjectionViewer.app/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualProjectionViewer-macOS
          path: VirtualProjectionViewer-macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VirtualProjectionViewer-Windows/VirtualProjectionViewer-Windows.zip
            VirtualProjectionViewer-macOS/VirtualProjectionViewer-macOS.zip
          generate_release_notes: true
