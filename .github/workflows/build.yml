# Virtual Projection Viewer — build workflow
# v2 (2026-09-10)
#   - bundle ndi-python (NDIlib) so releases have real NDI, not just the fallback
#   - ad-hoc codesign the macOS bundle so its internal dylibs load
#   - drop the redundant cp of source modules (PyInstaller already bundles them)

name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify NDI is importable
        run: python -c "import NDIlib; print('NDIlib OK')"

      - name: Build exe
        shell: bash
        run: |
          python -m PyInstaller \
            --name "VirtualProjectionViewer" \
            --onedir \
            --noconfirm \
            --hidden-import moderngl \
            --hidden-import glm \
            --hidden-import numpy \
            --hidden-import tkinter \
            --hidden-import tkinter.filedialog \
            --hidden-import NDIlib \
            --collect-all NDIlib \
            --collect-all imgui_bundle \
            --collect-all moderngl \
            main.py

      - name: Zip artifact
        shell: bash
        run: |
          cd dist
          7z a ../VirtualProjectionViewer-Windows.zip VirtualProjectionViewer/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualProjectionViewer-Windows
          path: VirtualProjectionViewer-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify NDI is importable
        run: python -c "import NDIlib; print('NDIlib OK')"

      - name: Build app
        run: |
          python -m PyInstaller \
            --name "VirtualProjectionViewer" \
            --onedir \
            --noconfirm \
            --hidden-import moderngl \
            --hidden-import glm \
            --hidden-import numpy \
            --hidden-import tkinter \
            --hidden-import tkinter.filedialog \
            --hidden-import NDIlib \
            --collect-all NDIlib \
            --collect-all imgui_bundle \
            --collect-all moderngl \
            main.py

      # Ad-hoc signature. Without this, macOS refuses to load the bundled
      # Python dylib ("library load disallowed by system policy").
      # This is not notarization — users still need to clear quarantine once.
      - name: Ad-hoc codesign
        run: |
          codesign --force --deep --sign - dist/VirtualProjectionViewer
          codesign --verify --verbose dist/VirtualProjectionViewer

      - name: Zip artifact
        run: |
          cd dist
          zip -ry ../VirtualProjectionViewer-macOS.zip VirtualProjectionViewer/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualProjectionViewer-macOS
          path: VirtualProjectionViewer-macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VirtualProjectionViewer-Windows/VirtualProjectionViewer-Windows.zip
            VirtualProjectionViewer-macOS/VirtualProjectionViewer-macOS.zip
          generate_release_notes: true
